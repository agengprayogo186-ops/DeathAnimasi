name: Bangun Dimensi Kematian

on:
  push:
    branches: [ utama ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file dari repo
        uses: actions/checkout@v4

      - name: Pasang Jawa 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan sumber
        run: |
          if [ -f pom.xml ]; then
            echo "SRC=." >> $GITHUB_ENV
          else
            unzip -oq ./*.zip -d src_unzip
            echo "SRC=src_unzip" >> $GITHUB_ENV
          fi

      - name: Buat jar
        working-directory: ${{ env.SRC }}
        run: mvn -B package

      - name: Simpan toples
        uses: actions/upload-artifact@v4
        with:
          name: Dimensi Kematian-guci
          path: ${{ env.SRC }}/target/DeathDimension.jar
